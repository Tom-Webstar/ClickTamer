name: Linux AMD64

on:
  push:
    branches: [dev-linux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
      - name: Show Go formatting corrections
        run: gofmt -d internal/keys/tap_linux.go internal/keys/tap_linux_test.go
      - name: Linux tests, vet and build
        run: just ci-linux
      - uses: actions/upload-artifact@v4
        with:
          name: clicktamer-linux-amd64
          path: dist/clicktamer-linux-amd64
          if-no-files-found: error
