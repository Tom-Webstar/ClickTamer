name: Linux AMD64

on:
  push:
    branches: [dev-linux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
      - name: Linux tests, vet, build and package
        id: build
        run: |
          version=$(just build-version)
          just ci-linux "$version"
          name="clicktamer-linux-amd64-$version"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: dist/${{ steps.build.outputs.artifact }}.tar.gz
          if-no-files-found: error
